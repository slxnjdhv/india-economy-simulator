[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "indiasim"
version = "0.1.0"
description = "Agent-based simulator of the Indian economy (Economy Lab), calibrated to RBI, MoSPI and PLFS data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Dr Sulaxan" }]
dependencies = ["mini-racer>=0.12", "numpy>=1.22", "pandas>=1.5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://slxnjdhv.github.io/india-economy-simulator/"
Source = "https://github.com/slxnjdhv/india-economy-simulator"

[tool.hatch.build.targets.wheel]
packages = ["src/indiasim"]
